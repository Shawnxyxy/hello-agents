<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>健康助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chatgpt-app">

<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

<aside class="sidebar" id="sidebar" aria-label="侧边栏">
    <div class="sidebar-top">
        <button type="button" class="sidebar-new-btn" id="newChatBtn">
            <span class="icon-plus">+</span> 新对话
        </button>
        <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="关闭侧边栏">×</button>
    </div>

    <nav class="session-list" id="sessionList" aria-label="历史对话">
        <p class="session-list-empty">暂无历史对话</p>
    </nav>

    <div class="sidebar-footer">
        <button type="button" class="user-chip" id="userChip" aria-expanded="false" aria-controls="userPanel">
            <span class="user-avatar" id="userAvatar">U</span>
            <span class="user-name" id="userDisplayName">用户</span>
        </button>
        <div class="user-panel hidden" id="userPanel">
            <label class="user-panel-label" for="displayNameInput">显示名称</label>
            <input type="text" id="displayNameInput" maxlength="32" placeholder="怎么称呼你" />
            <p class="user-panel-hint">用户标识（自动生成，用于数据隔离）</p>
            <code class="user-id-code" id="userIdDisplay"></code>
            <button type="button" class="btn-text-danger" id="resetUserBtn">重置身份（清空本地数据）</button>
        </div>
    </div>
</aside>

<main class="chat-main">
    <header class="chat-header">
        <button type="button" class="icon-btn" id="sidebarOpenBtn" aria-label="打开侧边栏">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 class="chat-header-title">健康助手</h1>
        <div class="chat-header-spacer"></div>
    </header>

    <div id="chatMessages" class="chat-messages" aria-live="polite">
        <div class="message-row message-assistant">
            <div class="message-avatar">AI</div>
            <div class="message-body">
                <p>你好，我是<strong>健康助手</strong>。</p>
                <ul>
                    <li>直接提问健康、饮食相关问题</li>
                    <li>上传 PDF / 文本体检报告，我会帮你解读</li>
                    <li>上传后可继续追问「我的指标怎么样？」</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="chatProgress" class="chat-progress hidden" aria-live="polite"></div>

    <footer class="chat-footer">
        <form id="chatForm" class="chat-composer">
            <div id="chatAttachmentPreview" class="chat-attachment-preview hidden"></div>
            <div class="composer-box">
                <label class="composer-attach" title="上传体检报告">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    <input type="file" id="chatFile" accept=".pdf,.txt" hidden />
                </label>
                <textarea id="chatInput" rows="1" placeholder="输入消息…" aria-label="消息输入"></textarea>
                <button type="submit" class="composer-send" id="chatSendBtn" aria-label="发送" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <p class="composer-hint">健康助手仅供参考，不能替代专业医疗诊断。</p>
        </form>
    </footer>
</main>

<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
